<nav class="navbar" [class.scrolled]="isScrolled" id="main-navbar">
  <div class="nav-container">
    <!-- Logo -->
    <a routerLink="/" class="nav-brand" id="nav-logo">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
      </div>
      <span class="brand-name">Factu<span class="brand-accent">Pro</span></span>
    </a>

    <!-- Nav Links -->
    <ul class="nav-links" [class.open]="menuOpen" id="nav-links">
      <li>
        <a routerLink="/home" routerLinkActive="active" id="nav-home" (click)="closeMenu()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Inicio
        </a>
      </li>
      <li>
        <a routerLink="/dashboard" routerLinkActive="active" id="nav-dashboard" (click)="closeMenu()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
          Dashboard
        </a>
      </li>
    </ul>

    <!-- Right Actions -->
    <div class="nav-actions">
      <a routerLink="/login" class="btn btn-primary btn-sm" id="nav-login-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Ingresar
      </a>
      <!-- Hamburger -->
      <button class="hamburger" [class.active]="menuOpen" (click)="toggleMenu()" id="nav-hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>
