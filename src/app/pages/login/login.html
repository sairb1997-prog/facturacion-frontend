<!-- ========================
     LOGIN PAGE
     ======================== -->
<div class="login-page">
  <!-- Background -->
  <div class="login-bg">
    <div class="login-orb login-orb-1"></div>
    <div class="login-orb login-orb-2"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="login-wrapper">
    <!-- Left Panel -->
    <div class="login-info animate-fade-up">
      <a routerLink="/" class="login-brand" id="login-brand-link">
        <div class="brand-icon-lg">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </div>
        <span>Factu<span class="brand-accent">Pro</span></span>
      </a>

      <div class="login-info-content">
        <h2>Tu negocio,<br><span class="gradient-text">bajo control.</span></h2>
        <p>Accede a tu panel de administración para gestionar facturas, inventario y clientes en tiempo real.</p>

        <div class="login-features">
          <div class="login-feature" *ngFor="let f of loginFeatures">
            <div class="lf-check">✓</div>
            <span>{{ f }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Panel (Form) -->
    <div class="login-form-panel animate-fade-up delay-2">
      <div class="login-form-card glass">
        <div class="lfc-header">
          <h1>Bienvenido</h1>
          <p>Ingresa tus credenciales para continuar</p>
        </div>

        <form class="login-form" (ngSubmit)="onLogin()" id="login-form" #loginForm="ngForm">

          <div class="form-group">
            <label class="form-label" for="email-input">Correo electrónico</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
              </span>
              <input
                id="email-input"
                type="email"
                class="form-control"
                placeholder="correo@empresa.com"
                [(ngModel)]="email"
                name="email"
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password-input">Contraseña</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input
                id="password-input"
                [type]="showPassword ? 'text' : 'password'"
                class="form-control"
                placeholder="••••••••"
                [(ngModel)]="password"
                name="password"
                required
              >
              <button
                type="button"
                class="toggle-password"
                (click)="togglePassword()"
                id="toggle-password-btn"
                aria-label="Toggle password visibility"
              >
                <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="checkbox-label" id="remember-me-label">
              <input type="checkbox" id="remember-me" [(ngModel)]="rememberMe" name="rememberMe">
              <span class="checkbox-custom"></span>
              <span>Recordarme</span>
            </label>
            <a href="#" class="forgot-link" id="forgot-password-link">¿Olvidaste tu contraseña?</a>
          </div>

          <div class="login-error animate-fade-in" *ngIf="errorMessage" id="login-error-msg">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            {{ errorMessage }}
          </div>

          <app-button
            type="submit"
            variant="primary"
            size="medium"
            [full]="true"
            [disabled]="isLoading"
            id="login-submit-btn"
          >
            @if (isLoading) {
              <span class="loading-spinner"></span>
            } @else {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                <polyline points="10 17 15 12 10 7"/>
                <line x1="15" y1="12" x2="3" y2="12"/>
              </svg>
              Ingresar al sistema
            }
          </app-button>

        </form>
      </div>
    </div>
  </div>
</div>
