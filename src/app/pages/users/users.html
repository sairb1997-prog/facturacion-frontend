<!-- USERS PAGE -->
<main class="dashboard-page">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <div class="sidebar-logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
        </div>
        <span>Factu<span class="brand-accent">Pro</span></span>
      </div>
      <button class="sidebar-toggle" (click)="toggleSidebar()" id="sidebar-toggle-btn" aria-label="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <ul>
        <li *ngFor="let item of navItems">
          <a [id]="'sidebar-nav-' + item.id"
             [class.active]="activeSection === item.id"
             (click)="setSection(item.id)"
             class="sidebar-link"
             [title]="item.label">
            <span class="sidebar-icon" [innerHTML]="item.icon"></span>
            <span class="sidebar-label" *ngIf="!sidebarCollapsed">{{ item.label }}</span>
            <span class="nav-badge" *ngIf="item.badge && !sidebarCollapsed">{{ item.badge }}</span>
          </a>
        </li>
      </ul>

      <!-- Cierre de sesión: último ítem del nav, justo sobre el pie del perfil -->
      <ul class="nav-bottom">
        <li>
          <button class="sidebar-link sidebar-logout" type="button" id="sidebar-logout-btn"
                  (click)="logout()" title="Cerrar sesión">
            <span class="sidebar-icon">🚪</span>
            <span class="sidebar-label" *ngIf="!sidebarCollapsed">Cerrar sesión</span>
          </button>
        </li>
      </ul>
    </nav>

    <!-- Pie del sidebar: perfil y rol del usuario -->
    <div class="sidebar-footer" *ngIf="!sidebarCollapsed">
      <div class="sidebar-user">
        <div class="user-avatar">A</div>
        <div>
          <div class="user-name">Admin</div>
          <div class="user-role">Administrador</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="dashboard-main">
    <header class="dashboard-header" id="dashboard-header">
      <div class="header-left">
        <h1 class="page-title">Usuarios</h1>
        <p class="page-subtitle">Directorio de usuarios del sistema</p>
      </div>
      <div class="header-right">
        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" placeholder="Buscar usuarios..." class="search-input">
        </div>
        <button variant="primary" size="small" id="header-action-btn" (action)="onAction()">Añadir usuario</button>
        <button class="header-avatar" type="button" aria-label="Abrir perfil" title="Abrir perfil">A</button>
      </div>
    </header>

    <section class="dashboard-content" id="section-users">
      <div class="users-list">
        <div class="user-card" *ngFor="let user of users; let i = index">
          <div class="user-avatar" [style.background]="user.color">{{ user.initials }}</div>
          <div class="user-info">
            <h4>{{ user.name }}</h4>
            <p>{{ user.email }}</p>
            <p class="user-role">Rol: {{ user.role }}</p>
            <p class="user-status" [ngClass]="user.statusClass">{{ user.status }}</p>
          </div>
          <div class="user-actions">
            <button variant="ghost" size="small" [id]="'view-user-' + i">Ver</button>
            <button variant="outline" size="small" [id]="'edit-user-' + i">Editar</button>
          </div>
        </div>
      </div>
    </section>

  </div>
</main>
